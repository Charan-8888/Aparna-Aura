  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#21131f"/>
      <stop offset="0.5" stop-color="#4a2944"/>
      <stop offset="1" stop-color="#120d13"/>
    </linearGradient>
    <radialGradient id="gem"><stop stop-color="#fff5ca"/><stop offset="0.35" stop-color="#d8ae3d"/><stop offset="1" stop-color="#8f5a12"/></radialGradient>
